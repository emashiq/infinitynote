name: release
# Builds the unsigned Windows and Linux installers for a version tag and publishes them as a GitHub Release.
# It only builds and publishes: the static gates, the end-to-end tests and the packaged native self-test run in ci.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.1.0 (must match the package.json version)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  prepare:
    name: Check version and write release notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      # Fails when the tag is not v<package.json version> or CHANGELOG.md has no section for it.
      - run: node tools/release-notes.mjs "$TAG" > release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-text
          path: |
            release-notes.md
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  build:
    name: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      # package:current runs the production build (electron-vite) before electron-builder.
      - run: npm run package:current
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      # Starts the Pages deploy below: a release made with GITHUB_TOKEN does not trigger the release event there.
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: built
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-text
          path: text
      # Stable, version-less asset names: the website links to releases/latest/download/<name>, so these names
      # must not change between releases (docs/RELEASE_CHECKLIST.md).
      - name: Stage assets under their stable names
        run: |
          shopt -s nullglob
          mkdir assets
          stage() {
            local files=(built/$1)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $1 installer, found ${#files[@]}"
              exit 1
            fi
            mv "${files[0]}" "assets/$2"
          }
          stage '*.exe' Infinity-Notes-Setup-x64.exe
          stage '*.deb' infinity-notes_amd64.deb
          stage '*.AppImage' Infinity-Notes-x86_64.AppImage
          cp text/THIRD_PARTY_NOTICES.md assets/
      - name: SHA-256 checksums
        working-directory: assets
        run: |
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Infinity Notes $TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file text/release-notes.md --prerelease=false --latest
          else
            gh release create "$TAG" assets/* --verify-tag --title "$title" --notes-file text/release-notes.md --latest
          fi
      # Refreshes the website's releases.json so its download cards name this release.
      - name: Deploy the website
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
